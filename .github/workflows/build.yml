name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build app and DMG
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: Build app bundle
        run: ./Scripts/build_app.sh

      - name: Package DMG
        run: ./Scripts/package_dmg.sh

      - name: Verify bundle
        run: |
          test -x OpenBright.app/Contents/MacOS/OpenBright
          test -f OpenBright.app/Contents/Resources/AppIcon.icns
          plutil -lint OpenBright.app/Contents/Info.plist
          hdiutil verify OpenBright_Installer.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBright_Installer
          path: OpenBright_Installer.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" OpenBright_Installer.dmg \
            --title "OpenBright ${GITHUB_REF_NAME}" \
            --generate-notes
